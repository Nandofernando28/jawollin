<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 470" width="100%" height="auto" style="font-family: 'Segoe UI', system-ui, sans-serif; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 10px;">
  <!-- Connectors from Center (510, 235) -->
  <path d="M 510 235 C 370 235, 350 90, 270 90" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M 510 235 C 370 235, 350 250, 270 250" fill="none" stroke="#0891b2" stroke-width="3"/>
  <path d="M 510 235 C 370 235, 350 395, 270 395" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <path d="M 510 235 C 650 235, 670 125, 740 125" fill="none" stroke="#059669" stroke-width="3"/>
  <path d="M 510 235 C 650 235, 670 355, 740 355" fill="none" stroke="#ea580c" stroke-width="3"/>

  <!-- Center Node -->
  <rect x="385" y="185" width="250" height="100" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <text x="510" y="218" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">🧟‍♂️ OPERACIÓN</text>
  <text x="510" y="238" font-size="13.5" font-weight="bold" fill="#38bdf8" text-anchor="middle">CORTAFUEGOS MANTA</text>
  <text x="510" y="258" font-size="10" fill="#cbd5e1" text-anchor="middle">Red Multicapa Día/Noche +</text>
  <text x="510" y="272" font-size="10" fill="#cbd5e1" text-anchor="middle">Optimizador Marginal por Presupuesto</text>

  <!-- Branch 1: Territorio y Poblacion (Top Left) -->
  <rect x="18" y="22" width="320" height="122" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="178" y="44" font-size="11.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">📍 1. Territorio y Población (Manta - INEC)</text>
  <text x="30" y="65" font-size="9.8" fill="#1e293b">• <tspan font-weight="bold">5 Parroquias:</tspan> Tarqui (38%), Eloy Alfaro (24%),</text>
  <text x="40" y="80" font-size="9.8" fill="#1e293b">Manta Centro (22%), Los Esteros (11%), San Mateo (5%)</text>
  <text x="30" y="98" font-size="9.8" fill="#1e293b">• <tspan font-weight="bold">Hubs Críticos:</tspan> ULEAM, Mercado Tarqui, Mercado</text>
  <text x="40" y="113" font-size="9.8" fill="#1e293b">Central, Empacadoras de Atún, Terminal Terrestre</text>
  <text x="30" y="131" font-size="9.8" fill="#1e293b">• <tspan font-weight="bold">Movilidad:</tspan> Líneas de bus inter-parroquiales</text>

  <!-- Branch 2: Grafo Multicapa (Middle Left) -->
  <rect x="18" y="168" width="320" height="135" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="178" y="190" font-size="11.5" font-weight="bold" fill="#0e7490" text-anchor="middle">🕸️ 2. Grafo Multicapa (Rutina Día vs Noche)</text>
  <text x="30" y="212" font-size="9.8" fill="#1e293b">• <tspan font-weight="bold">☀️ Fase Diurna (Superpropagación):</tspan></text>
  <text x="40" y="227" font-size="9.5" fill="#334155">Conecta personas en Hubs laborales/educativos y buses.</text>
  <text x="30" y="247" font-size="9.8" fill="#1e293b">• <tspan font-weight="bold">🌙 Fase Nocturna (Clúster Familiar):</tspan></text>
  <text x="40" y="262" font-size="9.5" fill="#334155">Contagio estrecho dentro de hogares y manzanas barriales.</text>
  <text x="30" y="282" font-size="9.8" fill="#1e293b">• <tspan font-weight="bold">Nodos Puente:</tspan> Choferes, comerciantes y estudiantes.</text>

  <!-- Branch 3: Modelo Epidemiologico (Bottom Left) -->
  <rect x="18" y="325" width="320" height="125" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="178" y="347" font-size="11.5" font-weight="bold" fill="#6d28d9" text-anchor="middle">🧬 3. Dinámica Epidemiológica (SEIR-VQ)</text>
  <text x="30" y="368" font-size="9.8" fill="#1e293b">• 🟢 <tspan font-weight="bold">Sano (S):</tspan> Susceptible a mordida/contagio</text>
  <text x="30" y="385" font-size="9.8" fill="#1e293b">• 🟡 <tspan font-weight="bold">Mordido (E):</tspan> Incubando sin síntomas aún</text>
  <text x="30" y="402" font-size="9.8" fill="#1e293b">• 🔴 <tspan font-weight="bold">Zombie (I):</tspan> Infeccioso activo que propaga</text>
  <text x="30" y="419" font-size="9.8" fill="#1e293b">• 🟣 <tspan font-weight="bold">Aislado (Q):</tspan> Contenido por brigada sanitaria</text>
  <text x="30" y="436" font-size="9.8" fill="#1e293b">• 🔵 <tspan font-weight="bold">Exorcizado (R/V):</tspan> Recuperado o vacunado con éxito</text>

  <!-- Branch 4: Motor de Defensa (Top Right) -->
  <rect x="675" y="25" width="325" height="195" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="837" y="47" font-size="11.5" font-weight="bold" fill="#047857" text-anchor="middle">🛡️ 4. Defensas Combinadas ("Escudo Manta")</text>
  <text x="688" y="69" font-size="9.8" fill="#1e293b" font-weight="bold">1) LA RED: Cortafuegos / Fumigación de Hubs</text>
  <text x="698" y="84" font-size="9.3" fill="#334155">Cierra o fumiga un hub cuando es lo que más rinde,</text>
  <text x="698" y="98" font-size="9.3" fill="#334155">y reduce un 88% el contagio dentro del hub ese día.</text>
  <text x="688" y="118" font-size="9.8" fill="#1e293b" font-weight="bold">2) LA LANZA: Brigadas de Aislamiento</text>
  <text x="698" y="133" font-size="9.3" fill="#334155">Neutraliza a los 🔴 Zombies con más conexiones activas.</text>
  <text x="688" y="153" font-size="9.8" fill="#1e293b" font-weight="bold">3) EL ESCUDO: Vacunación Anillo + Puente</text>
  <text x="698" y="168" font-size="9.3" fill="#334155">Filtra SOLO nodos 🟢 Sanos (0% desperdicio) a 1–2</text>
  <text x="698" y="182" font-size="9.3" fill="#334155">saltos del brote con máxima centralidad de puente.</text>
  <text x="688" y="204" font-size="9.5" fill="#047857" font-weight="bold">✔ Optimiza el Retorno Marginal por cada $1 gastado</text>

  <!-- Branch 5: Evaluacion y Brote Sorpresa (Bottom Right) -->
  <rect x="675" y="250" width="325" height="198" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="837" y="272" font-size="11.5" font-weight="bold" fill="#c2410c" text-anchor="middle">☁️ 5. Prueba de Fuego y Brote Sorpresa</text>
  <text x="688" y="294" font-size="9.8" fill="#1e293b">• <tspan font-weight="bold">Comparación Triple Obligatoria:</tspan></text>
  <text x="698" y="310" font-size="9.3" fill="#334155">1. Línea Base: Sin intervención</text>
  <text x="698" y="324" font-size="9.3" fill="#334155">2. Línea Base: Intervención al azar (mismo presupuesto)</text>
  <text x="698" y="338" font-size="9.3" fill="#059669" font-weight="bold">3. Estrategia: Operación Cortafuegos Manta</text>
  <text x="688" y="358" font-size="9.8" fill="#1e293b">• <tspan font-weight="bold">Semilla Fija Reproducible (PCG64):</tspan></text>
  <text x="698" y="373" font-size="9.3" fill="#334155">Misma semilla + parámetros = idéntico resultado exacto.</text>
  <text x="688" y="393" font-size="9.8" fill="#1e293b">• <tspan font-weight="bold">🎃 Blindaje ante el Brote Sorpresa (5 min):</tspan></text>
  <text x="698" y="408" font-size="9.3" fill="#334155">Si cambia el brote, cada día recalcula qué rinde</text>
  <text x="698" y="422" font-size="9.3" fill="#334155">más por dólar: vacunas, brigadas o cierres.</text>
</svg>